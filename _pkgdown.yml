# URL where the pkgdown site will be published
url: https://paytonyau.github.io/OptSurvCutR/

template:
  bootstrap: 5
  bootswatch: "litera" # Clean, publication-quality theme
  # Improved code syntax highlighting (better colours than 'default')
  highlight: textmate  
  light-switch: true   # Enable light/dark mode toggle

# Correct Repo Configuration for "View Source" links
repo:
  url: https://github.com/paytonyau/OptSurvCutR/
  branch: main

development:
  mode: release

# Metadata for SEO
meta:
  keywords: survival analysis, time-to-event, cutpoint, threshold, biomarker, R package, bioinformatics, biostatistics, genetic algorithm, bootstrap, covariate adjustment

# Social Media Cards
og:
  title: "OptSurvCutR: Optimal Cut-point Selection"
  description: "Discover and validate optimal cut-points for survival analysis using systematic and genetic algorithms."

# --- SIDEBAR LINKS (Home) ---
home:
  links:
    - text: Support my work
      href: https://www.buymeacoffee.com/payton.yau
      icon: fas fa-coffee # Coffee Cup Icon
    - text: ORCID
      href: https://orcid.org/0000-0002-3283-0370
      icon: fab fa-orcid # ORCID Academic Icon
# ----------------------------

navbar:
  # "primary" gives the navbar a distinct colour based on the theme
  type: primary 
  structure:
    left:  [intro, reference, articles, news, manuscript]
    right: [search, github]
  components:
    intro:
      text: Get started
      menu:
        - text: "Overview"
          href: index.html
        - text: "Contributing Guide"
          href: contributing.html
        - text: "Code of Conduct"
          href: CODE_OF_CONDUCT.html
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Vignettes
      menu:
        - text: "CRC Virome Workflow" 
          href: articles/stratifying-crc-patients.html
        - text: "Rapeseed Germination Workflow" 
          href: articles/analysing-rapeseed-germination.html
    news:
      text: Changelog
      href: news/index.html
    manuscript:
       text: Manuscript
       href: https://doi.org/10.1101/2025.10.08.681246
       target: _blank
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/paytonyau/OptSurvCutR/
      aria-label: "GitHub repository"

reference:
  - title: "Core Workflow Functions"
    desc: "The main functions for the 3-step analysis."
    contents:
      - find_cutpoint_number
      - find_cutpoint
      - validate_cutpoint

  - title: "Plotting & Diagnostics"
    desc: "Functions for visualising results and checking model assumptions."
    contents:
      - plot_optimisation_curve
      - plot_cutpoint_residuals
      - plot.find_cutpoint
      - plot.find_cutpoint_number_result
      - plot.validate_cutpoint_result

  - title: "Inspecting & Reporting Results"
    desc: "Methods for summarising analysis objects and extracting results."
    contents:
      - summary.find_cutpoint
      - print.find_cutpoint
      - summary.find_cutpoint_number_result
      - print.find_cutpoint_number_result
      - summary.validate_cutpoint_result
      - print.validate_cutpoint_result

  - title: "Datasets"
    desc: "Example datasets included with the package."
    contents:
      - crc_virome
      - germination

footer:
  left: "Developed by Payton Yau."
  right:
    - text: "GitHub"
      href: https://github.com/paytonyau/OptSurvCutR/
    - text: "Report Issue"
      href: https://github.com/paytonyau/OptSurvCutR/issues

toc:
  depth: 3

sidebar:
  # 'links' automatically pulls from DESCRIPTION + the 'home' section above
  structure: [links, vignettes, reference, license, community, dev]
  components:
    vignettes:
      title: Vignettes
      links:
      - text: "CRC Virome Workflow"
        href: articles/stratifying-crc-patients.html
      - text: "Germination Workflow"
        href: articles/analysing-rapeseed-germination.html
    community:
      title: Community & Help
      links:
      - text: Report an Issue
        href: https://github.com/paytonyau/OptSurvCutR/issues
      - text: Contributing Guide
        href: contributing.html
      - text: Code of Conduct
        href: CODE_OF_CONDUCT.html

# Ensure a blank line at the end
